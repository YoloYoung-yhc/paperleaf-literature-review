services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - paperleaf-data:/app/data
    environment:
      DATA_DIR: /app/data
    init: true
    stop_grace_period: 30s
volumes:
  paperleaf-data:
